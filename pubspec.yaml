name: langigacards
description: "LanGigaCards (formerly LinguaCards) - a spaced-repetition flashcard app for learning languages. Converted from the LinguaCards Figma Make design."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.3
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
